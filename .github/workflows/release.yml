name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

env:
  EXPO_PUBLIC_JAMENDO_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_JAMENDO_CLIENT_ID != '' && secrets.EXPO_PUBLIC_JAMENDO_CLIENT_ID || '86d822d2' }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL != '' && secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://zrpshxysiwclwkjgftrk.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpycHNoeHlzaXdjbHdramdmdHJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMTk1MTMsImV4cCI6MjEwNzc5NTUxM30.fhBG8ZSS9b78lAzZFOWBKnPRrvoU-UHXY9ru2zxmJbI' }}
  EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Bundle release notes into the app
        run: node scripts/gen-whatsnew.js

      - name: Expo Prebuild (Generate Android Native Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Apply SONIQ Audio Native Patches
        run: node scripts/patch-expo-audio.js

      - name: Build Release APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Rename APK with Tag Name
        id: prepare-apk
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag_name }}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          OUTPUT_NAME="SONIQ-${TAG}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"
          NOTES="docs/changelog/${TAG}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" release-notes.md; else echo "- 🛠️ Bug fixes and speed improvements" > release-notes.md; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk=$OUTPUT_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare-apk.outputs.tag }}
          name: SONIQ ${{ steps.prepare-apk.outputs.tag }}
          files: ${{ steps.prepare-apk.outputs.apk }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
