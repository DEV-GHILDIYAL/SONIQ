name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

# Least privilege: read-only by default, jobs ask for more only where needed.
permissions:
  contents: read

# One release per tag at a time (a re-pushed tag cancels the older run).
concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL != '' && secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://zrpshxysiwclwkjgftrk.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpycHNoeHlzaXdjbHdramdmdHJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMTk1MTMsImV4cCI6MjEwNzc5NTUxM30.fhBG8ZSS9b78lAzZFOWBKnPRrvoU-UHXY9ru2zxmJbI' }}
  EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}

jobs:
  # 1. Tag vs app.json version + release notes. Fails fast before the long build.
  prepare:
    name: 📋 Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check tag matches app.json version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          TAG_VERSION="${TAG#v}"
          echo "Tag: $TAG  ·  app.json: $APP_VERSION"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match app.json version $APP_VERSION. Bump app.json (version + versionCode) before tagging, otherwise the in-app updater keeps offering this update."
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          NOTES="docs/changelog/${TAG}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
          else
            echo "::warning::$NOTES not found, using default notes."
            echo "- 🛠️ Bug fixes and speed improvements" > release-notes.md
          fi
          {
            echo "### 📝 What's new in $TAG"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # 2. Type errors block the release.
  typecheck:
    name: 🔍 Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Bundle release notes (generated file is type-checked)
        run: node scripts/gen-whatsnew.js
      - name: TypeScript
        run: npm run typecheck

  # 3. Lint is clean now, so it blocks the release.
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: ESLint
        run: npm run lint

  # 4. Report only for now: never blocks the release.
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Jest
        run: npm test -- --ci

  # 5. Security: leaked secrets + vulnerable app dependencies. Blocks the release.
  security:
    name: 🛡️ Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan every commit, not just the latest

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Dependency audit
        run: |
          # Full report in the run summary (everything, incl. build tools).
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json"); const v = a.metadata?.vulnerabilities ?? {};
            const rows = Object.entries(a.vulnerabilities ?? {})
              .sort((x, y) => ["critical","high","moderate","low","info"].indexOf(x[1].severity) - ["critical","high","moderate","low","info"].indexOf(y[1].severity))
              .map(([n, d]) => `| ${d.severity} | ${n} | ${d.isDirect ? "direct" : "via another package"} |`);
            const out = [
              "### 🛡️ Dependency audit (app dependencies)",
              `critical **${v.critical ?? 0}** · high **${v.high ?? 0}** · moderate ${v.moderate ?? 0} · low ${v.low ?? 0}`,
              "", "| Severity | Package | How |", "|---|---|---|", ...rows,
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
          # Gate: no critical vulnerabilities in what ships with the app.
          npm audit --omit=dev --audit-level=critical

  # 6. Static code analysis (results appear under the repo's Security tab). Report only.
  codeql:
    name: 🔬 CodeQL
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # 7. The APK itself.
  build:
    name: 🏗️ Build APK
    needs: [prepare, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Bundle release notes into the app
        run: node scripts/gen-whatsnew.js

      - name: Expo prebuild (Android native project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Apply SONIQ audio native patches
        run: node scripts/patch-expo-audio.js

      # android/ only exists after prebuild, so Gradle caching is set up here (not in setup-java).
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle assembleRelease
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          OUT="SONIQ-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          SIZE=$(du -h "$OUT" | cut -f1)
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "### 📦 $OUT ($SIZE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 7

  # 8. Publish: only when build, lint and security all passed.
  release:
    name: 🚀 Publish release
    needs: [prepare, build, lint, security]
    permissions:
      contents: write # create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: SONIQ ${{ env.TAG }}
          files: SONIQ-${{ env.TAG }}.apk
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: echo "### 🚀 SONIQ ${TAG} is live — friends get it from the in-app updater." >> "$GITHUB_STEP_SUMMARY"