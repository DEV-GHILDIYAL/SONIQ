<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Restore SONIQ</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121110;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #F5EFE8; }
  .card { width: min(92vw, 380px); padding: 28px 24px; border-radius: 20px; background: #1E1B19; text-align: center; }
  h1 { margin: 6px 0 4px; font-size: 22px; letter-spacing: 3px; color: #FF8A3D; }
  p { color: #B8AEA3; line-height: 1.5; font-size: 15px; }
  a.btn { display: block; margin-top: 18px; padding: 14px; border-radius: 12px; background: #FF8A3D;
          color: #121110; font-weight: 700; text-decoration: none; }
  small { display: block; margin-top: 14px; color: #6B655E; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:44px">🎧</div>
  <h1>SONIQ</h1>
  <p id="msg">Opening SONIQ to restore your account…</p>
  <a class="btn" id="open" href="#">Open in SONIQ</a>
  <small>Keep this link private — it restores your account.</small>
</div>
<script>
  // The ID + code are in the #fragment, so they never reach any server.
  var q = new URLSearchParams(location.hash.slice(1));
  var id = q.get('id'), code = q.get('code');
  var btn = document.getElementById('open');
  if (!id || !code) {
    document.getElementById('msg').textContent = 'This restore link is incomplete.';
    btn.style.display = 'none';
  } else {
    var deep = 'soniq://restore?id=' + encodeURIComponent(id) + '&code=' + encodeURIComponent(code);
    btn.href = deep;
    location.href = deep;
    setTimeout(function () {
      document.getElementById('msg').textContent = "Didn't open? Make sure SONIQ is installed, then tap the button.";
    }, 1500);
  }
</script>
</body>
</html>
